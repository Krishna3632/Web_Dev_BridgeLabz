
<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Q5 — Filter Cards with Animation</title>
<style>
  :root{{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}}
  body{{margin:24px}}
  .cards{{display:flex;gap:20px;align-items:flex-start}}
  .card{{flex:1;padding:16px;border-radius:12px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.06);transition:transform .3s ease;animation:fadeIn .6s ease both}}
  .card img{{width:100%;height:200px;object-fit:cover;border-radius:8px;filter:grayscale(100%);transition:filter .35s, transform .35s}}
  .card:hover{{transform:translateY(-10px)}}
  .card:hover img{{filter:none;transform:scale(1.02)}}

  @keyframes fadeIn{{from{{opacity:0;transform:translateY(8px)}} to{{opacity:1;transform:none}}}}
  @media (max-width:800px){{ .cards{{flex-direction:column}} }}
</style>
</head>
<body>
<h1>Profile Cards</h1>
<div class="cards">
  <div class="card"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#cfe2f3&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Person 1
  &lt;/text&gt;
&lt;/svg&gt;" alt=""><h3>Person One</h3><p>Short bio text.</p></div>
  <div class="card"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#f7d6c1&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Person 2
  &lt;/text&gt;
&lt;/svg&gt;" alt=""><h3>Person Two</h3><p>Short bio text.</p></div>
  <div class="card"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#d6f7e8&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Person 3
  &lt;/text&gt;
&lt;/svg&gt;" alt=""><h3>Person Three</h3><p>Short bio text.</p></div>
</div>
</body>
</html>
