
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Q1 — Responsive Image Filter Gallery</title>
<style>
  :root{{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;gap:12px}}
  body{{margin:0;padding:24px;box-sizing:border-box;line-height:1.4}}
  h1{{text-align:center;margin-bottom:16px}}
  .grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}}
  figure{{margin:0;display:flex;flex-direction:column;align-items:stretch}}
  .img-wrap{{overflow:hidden;border-radius:8px}}
  img{{width:100%;height:200px;object-fit:cover;display:block;transition:filter .4s ease, transform .3s ease}}
  figcaption{{padding:8px 6px;text-align:center}}

  /* different filters */
  .f1 img{{filter:blur(2px)}} 
  .f2 img{{filter:grayscale(100%)}} 
  .f3 img{{filter:sepia(80%)}} 
  .f4 img{{filter:brightness(0.6)}} 
  .f5 img{{filter:contrast(140%)}} 
  .f6 img{{filter:hue-rotate(90deg)}} 

  /* remove filter on hover */
  figure:hover img{{filter:none;transform:scale(1.02)}}

  @media (max-width:600px){{
    .grid{{grid-template-columns:1fr}}
    img{{height:220px}}
  }}
</style>
</head>
<body>
<h1>Responsive Image Filter Gallery</h1>
<div class="grid">
  <figure class="f1"><div class="img-wrap"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Blur
  &lt;/text&gt;
&lt;/svg&gt;"></div><figcaption>Blur effect</figcaption></figure>
  <figure class="f2"><div class="img-wrap"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Grayscale
  &lt;/text&gt;
&lt;/svg&gt;"></div><figcaption>Grayscale</figcaption></figure>
  <figure class="f3"><div class="img-wrap"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Sepia
  &lt;/text&gt;
&lt;/svg&gt;"></div><figcaption>Sepia</figcaption></figure>
  <figure class="f4"><div class="img-wrap"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Brightness
  &lt;/text&gt;
&lt;/svg&gt;"></div><figcaption>Brightness</figcaption></figure>
  <figure class="f5"><div class="img-wrap"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Contrast
  &lt;/text&gt;
&lt;/svg&gt;"></div><figcaption>Contrast</figcaption></figure>
  <figure class="f6"><div class="img-wrap"><img src="data:image/svg+xml;charset=utf-8,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;
  &lt;rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/&gt;
  &lt;text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-family=&quot;Arial&quot; font-size=&quot;36&quot; fill=&quot;#666&quot;&gt;
    Hue Rotate
  &lt;/text&gt;
&lt;/svg&gt;"></div><figcaption>Hue-rotate</figcaption></figure>
</div>
</body>
</html>
