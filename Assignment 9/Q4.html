
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Q4 — Responsive Typography</title>
<style>
  :root{{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}}
  body{{margin:0;padding:40px;display:flex;align-items:center;justify-content:center;min-height:100vh;box-sizing:border-box}}
  .container{{max-width:900px;text-align:center;padding:20px}}
  h1{{font-size:clamp(1.5rem,4vw,3rem);margin:0 0 12px}}
  p{{font-size:clamp(1rem,2vw,1.5rem);margin:0;line-height:1.6}}

  @media (max-width:700px){{
    p{{line-height:1.4;padding:10px}}
    .container{{padding:12px}}
  }}
</style>
</head>
<body>
<div class="container">
  <h1>Responsive Heading with clamp()</h1>
  <p>This paragraph demonstrates how font sizes scale using relative units and the <code>clamp()</code> function. Resize the browser to see the text adapt for comfortable reading.</p>
</div>
</body>
</html>
