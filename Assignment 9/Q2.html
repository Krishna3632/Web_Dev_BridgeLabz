
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Q2 — Responsive Web Design Layout</title>
<style>
  :root{{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}}
  body{{margin:0;padding:0;box-sizing:border-box}}
  header{{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#114b5f;color:#fff}}
  .logo{{font-weight:700}}
  nav a{{color:#fff;margin-left:16px;text-decoration:none}}
  main{{padding:24px;display:flex;gap:16px;justify-content:space-between;align-items:flex-start}}
  .feature{{flex:1;padding:20px;border-radius:10px;background:#f3f7f7;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .25s;min-width:0}}
  .feature:hover{{transform:scale(1.03)}}
  footer{{text-align:center;padding:16px;background:#0b2a33;color:#fff;margin-top:24px}}

  @media (max-width:750px){{
    main{{flex-direction:column}}
  }}
</style>
</head>
<body>
<header>
  <div class="logo">MyLogo</div>
  <nav><a href="#">Home</a><a href="#">Features</a><a href="#">Contact</a></nav>
</header>
<main>
  <div class="feature"><h2>Feature One</h2><p>Short description of feature one.</p></div>
  <div class="feature"><h2>Feature Two</h2><p>Short description of feature two.</p></div>
  <div class="feature"><h2>Feature Three</h2><p>Short description of feature three.</p></div>
</main>
<footer>© 2025 Your Name — Contact: email@example.com</footer>
</body>
</html>
