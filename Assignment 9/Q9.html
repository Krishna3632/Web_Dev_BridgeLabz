
<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Q9 — Responsive Design Principles</title>
<style>
  :root{{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}}
  body{{margin:20px}}
  .grid{{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}}
  .box{{padding:16px;border-radius:8px;background:#fff;border:1px solid #eee;transition:background .25s,color .25s}}
  .box:hover{{background:linear-gradient(135deg,#89f7fe,#66a6ff);color:#fff}}
  @media (max-width:600px){{ .grid{{grid-template-columns:1fr}} }}
</style></head><body>
<h1>Responsive Design Principles</h1>
<div class="grid">
  <div class="box"><h3>Fluid Layouts</h3><p>Use relative units like % and vw</p></div>
  <div class="box"><h3>Flexible Media</h3><p>Images: max-width:100% and height:auto</p></div>
  <div class="box"><h3>Breakpoints</h3><p>Set media queries for device widths</p></div>
</div>
</body></html>
