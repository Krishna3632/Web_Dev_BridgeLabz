
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Q3 — Responsive Cards</title>
<style>
  :root{{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}}
  body{{margin:20px}}
  .row{{display:flex;gap:16px;flex-wrap:wrap}}
  .card{{flex:1 1 calc(25% - 16px);min-width:180px;padding:18px;border-radius:10px;background:#fff;border:1px solid #eee;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:background .25s}}
  .card:hover{{background:#f0f8ff}}

  @media (max-width:900px){{
    .card{{flex:1 1 calc(50% - 16px)}}
  }}
  @media (max-width:600px){{
    .card{{flex:1 1 100%}}
  }}
</style>
</head>
<body>
<h1>Responsive Cards</h1>
<div class="row">
  <div class="card"><h3>Card 1</h3><p>Example content</p></div>
  <div class="card"><h3>Card 2</h3><p>Example content</p></div>
  <div class="card"><h3>Card 3</h3><p>Example content</p></div>
  <div class="card"><h3>Card 4</h3><p>Example content</p></div>
</div>
</body>
</html>
