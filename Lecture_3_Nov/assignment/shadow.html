<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="shadow.css">
</head>
<body>
    <div class="shadow-container">
        <div class="card card1">
            <h3>Subtle Shadow</h3>
            <p>This card has a very light, standard box-shadow.</p>
        </div>
        <div class="card card2">
            <h3>Deep Shadow</h3>
            <p>This card has a larger, more diffuse shadow for more depth.</p>
        </div>
        <div class="card card3">
            <h3>Layered Shadow</h3>
            <p>This card uses multiple shadows for a layered effect.</p>
        </div>
    </div>
</body>
</html>
