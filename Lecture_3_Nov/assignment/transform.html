<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="transform.css">
</head>
<body>
    <h1>CSS Transformations Showcase</h1>
    <div class="transform-container">
        <div class="transform-wrapper">
            <div class="transform-box rotate">Rotate</div>
            <p>rotate(45deg)</p>
        </div>
        <div class="transform-wrapper">
            <div class="transform-box scale">Scale</div>
            <p>scale(1.2)</p>
        </div>
        <div class="transform-wrapper">
            <div class="transform-box translate">Translate</div>
            <p>translate(20px, -20px)</p>
        </div>
        <div class="transform-wrapper">
            <div class="transform-box skew">Skew</div>
            <p>skew(15deg, 10deg)</p>
        </div>
    </div>
</body>
</html>
