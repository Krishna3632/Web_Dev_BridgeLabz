<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task 5 - Button Collection</title>
<style>
:root{--primary:#2563eb;--secondary:#6b7280;}
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:40px;background:#f8fafc;}
.container{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;}
button{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,0.08);transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s;}
button:active{transform:translateY(1px);}
.primary{background:var(--primary);color:#fff;font-weight:700;}
.primary:hover{transform:scale(1.04);box-shadow:0 10px 30px rgba(37,99,235,0.18);}
.secondary{background:#eef2ff;color:var(--primary);border:1px solid rgba(37,99,235,0.08);}
.outline{background:transparent;border:2px solid #cbd5e1;color:#111;}
.disabled{background:#e6e6e6;color:#9aa0a6;cursor:not-allowed;box-shadow:none;}
/* focus and disabled pseudo-classes */
button:focus{outline:3px solid rgba(37,99,235,0.12);}
button[disabled]{opacity:0.7;transform:none;box-shadow:none;}
</style>
</head>
<body>
  <div class="container">
    <button class="primary">Primary</button>
    <button class="secondary">Secondary</button>
    <button class="outline">Outline</button>
    <button class="disabled" disabled>Disabled</button>
  </div>
</body>
</html>
