<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task 6 - Animations</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdfbfb,#ebedee);font-family:Arial,Helvetica,sans-serif;}
.stage{display:flex;gap:28px;align-items:center;justify-content:center;}
.box{width:100px;height:100px;background:#60a5fa;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 24px rgba(32,16,80,0.06);}
.bounce{animation:bounce 1s ease-in-out infinite alternate;}
@keyframes bounce{0%{transform:translateY(0);}100%{transform:translateY(-30px);}}
.move{width:160px;height:40px;background:#34d399;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#063;animation:slide 3s ease-in-out infinite alternate;}
@keyframes slide{0%{transform:translateX(-20px);}100%{transform:translateX(20px);}}
.color{font-weight:700;font-size:20px;animation:colorchange 2s ease-in-out infinite alternate;}
@keyframes colorchange{0%{color:#ef4444;}50%{color:#f59e0b;}100%{color:#10b981;}}
</style>
</head>
<body>
  <div class="stage">
    <div class="box bounce">Ball</div>
    <div class="move">Moving Box</div>
    <div class="color">Color Text</div>
  </div>
</body>
</html>
