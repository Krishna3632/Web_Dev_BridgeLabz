<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task 9 - Combined Effects</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fafafa;display:flex;align-items:center;justify-content:center;height:100vh;}
.container{display:flex;gap:18px;align-items:center;justify-content:center;}
.example{padding:12px;border-radius:10px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,0.06);transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;}
.example:hover{transform:scale(1.06);box-shadow:0 18px 48px rgba(0,0,0,0.12);background:#f0f9ff;}
.example:active{transform:scale(0.98);}
.example button{padding:10px 14px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;}
</style>
</head>
<body>
  <div class="container">
    <div class="example"><p>Grow & Color Change</p><button>Click</button></div>
    <div class="example"><p>Shadow Boost</p><button>Press</button></div>
    <div class="example"><p>Combined Effects</p><button>Action</button></div>
  </div>
</body>
</html>
