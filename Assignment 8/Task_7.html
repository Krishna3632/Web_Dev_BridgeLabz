<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task 7 - UI Components</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f3f4f6,#fff);display:flex;align-items:center;justify-content:center;height:100vh;}
.card{width:420px;padding:20px;border-radius:12px;background:#fff;box-shadow:0 12px 40px rgba(2,6,23,0.06);display:flex;flex-direction:column;gap:12px;}
.search{display:flex;gap:8px;}
.search input{flex:1;padding:10px;border-radius:8px;border:1px solid #e6e9ef;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);}
.select{padding:10px;border-radius:8px;border:1px solid #e6e9ef;}
button{padding:10px 12px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;}
.search input:focus, .select:focus, button:focus{outline:3px solid rgba(37,99,235,0.12);}
.row{display:flex;gap:8px;align-items:center;}
</style>
</head>
<body>
  <div class="card" role="region" aria-label="UI components">
    <h3 style="margin:0">Search Panel</h3>
    <div class="search">
      <input type="search" placeholder="Search..." aria-label="Search input">
      <select class="select" aria-label="Category"><option>All</option><option>Images</option></select>
      <button>Go</button>
    </div>

    <div class="row">
      <button>Primary</button>
      <button style="background:#e5e7eb;color:#111">Secondary</button>
    </div>

    <div>
      <label for="menu">Options</label>
      <select id="menu" class="select"><option>One</option><option>Two</option></select>
    </div>
  </div>
</body>
</html>
