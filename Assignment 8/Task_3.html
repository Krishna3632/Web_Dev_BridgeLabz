<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task 3 - Image Showcase</title>
<style>
:root{--gap:18px;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fafafa;display:flex;align-items:center;justify-content:center;height:100vh;}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);max-width:1000px;padding:20px;box-sizing:border-box;}
figure{position:relative;margin:0;border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.08);}
img{width:100%;height:220px;object-fit:cover;display:block;transition:transform 0.3s ease, filter 0.3s ease;}
figure::after{content:'';position:absolute;inset:0;background:transparent;transition:background 0.3s ease;}
figure:hover img{transform:scale(1.1);}
figure:hover::after{background:rgba(0,0,0,0.25);}
figcaption{padding:10px;background:#fff;text-align:center;font-size:14px;}
@media(max-width:700px){.gallery{grid-template-columns:1fr;} img{height:200px;}}
</style>
</head>
<body>
  <div class="gallery">
    <figure><img src="https://picsum.photos/id/1015/600/400" alt=""><figcaption>Mountain View</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1025/600/400" alt=""><figcaption>Bridge</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1003/600/400" alt=""><figcaption>Forest</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1043/600/400" alt=""><figcaption>City</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1050/600/400" alt=""><figcaption>Desert</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1069/600/400" alt=""><figcaption>Sea</figcaption></figure>
  </div>
</body>
</html>
