<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography Styling</title>
<style>
body {
  font-family: "Georgia", serif;
  line-height: 1.6;
  letter-spacing: 0.5px;
  margin: 40px;
  color: #333;
  text-align: justify;
}
h1 { text-align: center; }
mark { background: yellow; color: black; }
strong { color: darkred; }
em { color: navy; }
p::first-letter { font-size: 2em; font-weight: bold; color: darkblue; }
p::first-line { font-weight: bold; }
</style>
</head>
<body>
  <h1>Typography and Text Styling</h1>
  <p>
    <mark>Typography</mark> plays a crucial role in design. 
    A <strong>clear font</strong> and <em>balanced spacing</em> 
    improve readability and visual harmony.
  </p>
</body>
</html>
