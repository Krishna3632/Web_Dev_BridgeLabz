<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding Demo</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  height: 100vh;
  background: #f0f0f0;
}
.box {
  width: 150px;
  height: 100px;
  padding: 20px;
  text-align: center;
  transition: border-color 0.4s ease;
}
.solid { border: 4px solid #333; }
.dashed { border: 4px dashed #007BFF; }
.double { border: 6px double #28a745; }
.groove { border: 6px groove #ff5733; }
.rounded { border-radius: 15px; border: 4px solid #6f42c1; }
.box:hover {
  border-color: crimson;
}
</style>
</head>
<body>
  <div class="box solid">Solid Border</div>
  <div class="box dashed">Dashed Border</div>
  <div class="box double">Double Border</div>
  <div class="box groove">Groove Border</div>
  <div class="box rounded">Rounded Corners</div>
</body>
</html>
