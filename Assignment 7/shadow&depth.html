<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadows and Depth</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  height: 100vh;
  background: #f5f5f5;
  font-family: sans-serif;
}
.card {
  width: 200px; padding: 20px; text-align: center;
  border-radius: 12px; background: white;
  transition: all 0.3s ease;
}
.card h3 {
  text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}
.shadow1 { box-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
.shadow2 { box-shadow: 4px 4px 10px rgba(0,0,0,0.3); }
.shadow3 { box-shadow: 6px 6px 12px rgba(0,0,0,0.4); }
.card:hover {
  transform: translateY(-10px);
  box-shadow: 8px 8px 16px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
  <div class="card shadow1"><h3>Card 1</h3><p>Subtle shadow</p></div>
  <div class="card shadow2"><h3>Card 2</h3><p>Medium shadow</p></div>
  <div class="card shadow3"><h3>Card 3</h3><p>Strong shadow</p></div>
</body>
</html>
