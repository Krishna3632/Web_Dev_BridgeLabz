<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformations</title>
<style>
body {
  display: flex; justify-content: center; align-items: center;
  height: 100vh; gap: 20px; background: #eef;
  font-family: sans-serif;
}
.box {
  width: 100px; height: 100px; background: #007bff;
  display: flex; justify-content: center; align-items: center;
  color: white; transition: all 0.4s ease;
  flex-direction: column; border-radius: 10px;
}
.rotate:hover { transform: rotate(45deg); }
.scale:hover { transform: scale(1.3); }
.translate:hover { transform: translate(30px, 20px); }
.skew:hover { transform: skew(15deg, 10deg); }
</style>
</head>
<body>
  <div class="box rotate">Rotate</div>
  <div class="box scale">Scale</div>
  <div class="box translate">Translate</div>
  <div class="box skew">Skew</div>
</body>
</html>
