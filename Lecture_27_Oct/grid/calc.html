<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <div class="calculator">
    <textarea name="calc" id="calc" cols="30" rows="3" style="resize:none; padding: 10px; border: 8px; border-radius: 10px; background-color: black; color: white;"></textarea>
    <br>
 <div class="buttons">
    <button>AC</button>
    <button>+-</button>
    <button>%</button>
    <button class="operators">/</button>

    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button class="operators">x</button>

    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button class="operators">-</button>

    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button class="operators">+</button>

    <button class="zero">0</button>
    <button>.</button>
    <button class="operators" id="equal">=</button>
</div>

    </div>
    </div>  
</body>
</html>
