<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border: 2px solid rgb(119, 37, 41); border-radius: 10px; padding: 10px;">
        <div style="grid-column: span 3; text-align: center; border: 2px solid rgb(127, 46, 46); border-radius: 10px;"><h1>Pricing Plans</h1></div>
        <div style="border: 2px solid rgb(204, 203, 126); padding: 10px; border-radius: 10px;"><h2>Basic Plan</h2>
        <p>Price: $10/month</p>
        </div>
        <div style="border: 2px solid rgb(222, 166, 166); padding: 10px; border-radius: 10px;"><h2>Standard Plan</h2>
        <p>Price: $20/month</p>
        </div>
        <div style="border: 2px solid rgb(148, 216, 231); padding: 10px; border-radius: 10px;"><h2>Premium Plan</h2>
        <p>Price: $30/month</p>
        </div>
    </div>
    </div>
</body>
</html>
