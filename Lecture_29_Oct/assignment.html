<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Box</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen">
  <div class="bg-red-500 h-[700px] w-[600px] border flex flex-col gap-[30px] justify-center items-center rounded-2xl shadow-lg">
      <div class="h-[200px] w-[500px] bg-gray-400 flex justify-center items-center">
        <img src="" alt="" height="150px" width="300px" class="bg-white">
      </div>
    <div class="flex justify-between items-center gap-[50px]">
        <div class="bg-gray-300 h-[100px] w-[150px]"></div>
        <div class="bg-gray-300 h-[100px] w-[150px]"></div>
        <div class="bg-gray-300 h-[100px] w-[150px]"></div>
    </div>
    <div>
          <textarea placeholder="Search" class="rounded-full p-2 h-10 w-[300px] shadow-lg resize-none"></textarea>
    </div>
    <div class="flex justify-between gap-10">
        <div class="h-[100px] w-[150px] rounded-2xl bg-gray-300"></div>
        <div class="h-[100px] w-[150px] rounded-2xl bg-gray-300"></div>
        <div class="h-[100px] w-[150px] rounded-2xl bg-gray-300"></div>
    </div>
    </div>
</body>
</html>
