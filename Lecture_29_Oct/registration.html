<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#1C59A1] flex justify-center items-center min-h-screen p-4">

  <div class="bg-[#EEEEEE] p-8 rounded-2xl shadow-lg w-full max-w-xl mx-auto">
    
    <h2 class="text-[#4061D8] font-bold text-xl mb-6 text-center">REGISTRATION</h2>

    <form action="/register" method="POST">
      
      <div class="flex flex-col sm:flex-row gap-4 mb-4">
        <div class="w-full">
          <label for="first-name" class="sr-only">First Name</label>
          <input type="text" id="first-name" name="firstName" placeholder="First Name" 
            class="w-full border-b border-gray-400 bg-transparent focus:outline-none focus:border-[#4061D8] text-sm py-2" required>
        </div>
        <div class="w-full">
          <label for="last-name" class="sr-only">Last Name</label>
          <input type="text" id="last-name" name="lastName" placeholder="Last Name" 
            class="w-full border-b border-gray-400 bg-transparent focus:outline-none focus:border-[#4061D8] text-sm py-2" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="faculty" class="sr-only">Faculty</label>
        <select id="faculty" name="faculty" 
          class="w-full border-b border-gray-400 bg-transparent focus:outline-none focus:border-[#4061D8] text-sm py-2 text-gray-500" required>
          <option value="" disabled selected>Select your Faculty</option>
          <option value="engineering">Engineering</option>
          <option value="science">Science</option>
          <option value="arts">Arts & Humanities</option>
          <option value="business">Business</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="email" class="sr-only">Email</label>
        <input type="email" id="email" name="email" placeholder="Email"
          class="w-full border-b border-gray-400 bg-transparent focus:outline-none focus:border-[#4061D8] text-sm py-2" required>
      </div>
      
      <div class="flex flex-col sm:flex-row gap-4 mb-6">
        <div class="w-full">
          <label for="password" class="sr-only">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" 
            class="w-full border-b border-gray-400 bg-transparent focus:outline-none focus:border-[#4061D8] text-sm py-2" required>
        </div>
        <div class="w-full">
          <label for="confirm-password" class="sr-only">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm Password" 
            class="w-full border-b border-gray-400 bg-transparent focus:outline-none focus:border-[#4061D8] text-sm py-2" required>
        </div>
      </div>

      <div class="mb-6">
        <button type="submit" class="w-full bg-[#4061D8] hover:bg-[#2f4cbf] text-white font-semibold py-2 rounded-full transition-all">
          Register
        </button>
      </div>
      
      <div class="text-sm text-center">
        <p class="text-gray-700">
          Already have an account? 
          <a href="/login" class="text-[#4061D8] font-medium hover:underline">Sign In</a>
        </p>
      </div>
      
    </form>
  </div>

</body>
</html>
